# 暂存测试包：构建 + artifact + 预发布 Release `ci` 的分支坑位。
# **不打正式 tag、不发正式 Release、不动 main** —— 转正前先装机实测（AGENT.md 发版铁律）。
# 版本格式门禁：dev 须 X.Y（Y>=1），stable 须 X.0（见 VERSIONING.md）；旧 1.0.x 三段号直接失败。
# 用仓库 Secret KEYSTORE_B64（与线上同一个签名证书）→ 这个包可以直接覆盖安装，进度不丢。
name: staging
# ⚠️ workflow_dispatch 要求 workflow 文件存在于**默认分支**，新分支上没法手动触发；
# 所以这里同时挂 push 触发（push 事件用的是被推分支里的那份 workflow 文件，立刻可用）。
# 安全性：只挂自己人推的分支，**别加 pull_request**——fork PR 拿不到仓库 Secret。
on:
  workflow_dispatch:
    inputs:
      label: { description: "备注（只写进构建摘要）；ci-sync-only = 只修复聚合、不构建（兼容旧工作流入口）", required: false, default: "staging" }
      side_by_side:
        description: "同机双装包（包名加分支后缀，可与正式包并存；只能手动安装）"
        required: false
        default: "false"
      sync_only:
        description: "只同步 ci 聚合：移除已删除分支，不构建 APK / 不发布版本"
        required: false
        default: "false"
  push:
    branches: ["arena/**", "staging/**", "dev-build"]
permissions:
  contents: write          # 只用于把测试包传到预发布 Release `ci` 的资产（github.com 直链，供手机 App 内更新）
  checks: write            # 只用于把失败日志写回 ci-diagnostics 检查（沙箱/无日志权限的一侧靠它自查）
jobs:
  build:
    if: github.event.inputs.sync_only != 'true' && github.event.inputs.label != 'ci-sync-only'
    runs-on: ubuntu-latest
    outputs:
      ver: ${{ steps.meta.outputs.ver }}
      vc: ${{ steps.meta.outputs.vc }}
      bid: ${{ steps.meta.outputs.bid }}
      sbs: ${{ steps.meta.outputs.sbs }}
      apk: ${{ steps.meta.outputs.apk }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }

      - name: 版本格式门禁（VERSIONING.md）
        run: bash scripts/version.sh check

      # 多分支并行防撞号（VERSIONING.md §8）：同 code 已被分叉的另一条 arena 分支领走 → 拦下
      - name: 多分支撞号门禁（VERSIONING.md §8）
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_BRANCH: ${{ github.ref_name }}
        run: bash scripts/version.sh check-unique

      # 沙箱/助手侧经常读不到 Actions 的日志下载链接（外网白名单），
      # 所以把失败输出的前几行转成 ::error:: 注解 —— API 能查到，助手才能自己迭代。
      - name: Host tests（与本地同一条命令、同一份源码）
        run: |
          set +e
          bash scripts/run_tests.sh > /tmp/t.log 2>&1; ec=$?
          cat /tmp/t.log
          if [ $ec -ne 0 ]; then
            grep -E "error:|FAIL|Exception|找不到" /tmp/t.log | head -8 | cut -c1-380 \
              | while IFS= read -r l; do echo "::error::[tests] $l"; done
            echo "::error::主机侧测试未通过（exit $ec）"
            exit $ec
          fi

      - name: Install Android SDK pieces
        run: |
          mkdir -p $RUNNER_TEMP/sdk/build-tools $RUNNER_TEMP/sdk/platforms
          curl -sSL -o bt.zip https://dl.google.com/android/repository/build-tools_r34-linux.zip
          unzip -q bt.zip -d btX && mv btX/android-14 $RUNNER_TEMP/sdk/build-tools/34.0.0
          curl -sSL -o p.zip https://dl.google.com/android/repository/platform-34-ext7_r02.zip
          unzip -q p.zip -d pX && mv pX/android-34 $RUNNER_TEMP/sdk/platforms/android-34

      - name: Restore keystore
        env: { KEYSTORE_B64: "${{ secrets.KEYSTORE_B64 }}" }
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::缺 Secret KEYSTORE_B64：CI 无法用线上同一把钥匙签名，测试包会装不上老版本"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > wordsprint.keystore

      - name: Build
        env:
          SDK_ROOT: "${{ runner.temp }}/sdk"
          KS_PASS: "${{ secrets.KS_PASS }}"
          GIT_BRANCH: "${{ github.ref_name }}"
          SIDE_BY_SIDE: "${{ github.event.inputs.side_by_side == 'true' && '1' || '0' }}"
        run: |
          set +e
          bash build.sh > /tmp/b.log 2>&1; ec=$?
          cat /tmp/b.log
          if [ $ec -ne 0 ]; then
            grep -E "error:|错误|Exception|✗" /tmp/b.log | head -8 | cut -c1-380 \
              | while IFS= read -r l; do echo "::error::[build] $l"; done
            echo "::error::build.sh 失败（exit $ec）"
            exit $ec
          fi

      - name: Meta
        id: meta
        env: { GIT_BRANCH: "${{ github.ref_name }}" }
        run: |
          VER=$(grep -oE 'versionName="[^"]*"' AndroidManifest.xml | sed 's/versionName="//;s/"//')
          VC=$(grep -oE 'versionCode="[0-9]*"' AndroidManifest.xml | sed 's/[^0-9]//g')
          BID=$(bash scripts/branch_id.sh)
          SBS="${{ github.event.inputs.side_by_side == 'true' && '-sbs' || '' }}"
          APK="wordsprint-v${VER}${SBS}.apk"
          [ -f "$APK" ] || APK="wordsprint-v${VER}.apk"
          echo "ver=$VER"  >> "$GITHUB_OUTPUT"
          echo "vc=$VC"    >> "$GITHUB_OUTPUT"
          echo "bid=$BID"  >> "$GITHUB_OUTPUT"
          echo "apk=$APK"  >> "$GITHUB_OUTPUT"
          echo "sbs=$SBS"  >> "$GITHUB_OUTPUT"

      - name: 摘要
        run: |
          {
            echo "## 暂存测试包 v${{ steps.meta.outputs.ver }}（code ${{ steps.meta.outputs.vc }}）· 分支 \`${{ steps.meta.outputs.bid }}\`"
            echo
            echo "备注：${{ github.event.inputs.label }}；run #${{ github.run_number }}"
            if [ -n "${{ steps.meta.outputs.sbs }}" ]; then
              echo
              echo "> **同机双装包**：包名带 \`.sbs.${{ steps.meta.outputs.bid }}\` 后缀，可与正式包并存（数据隔离）。"
              echo "> 只能手动安装（下载 artifact），**应用内更新对它无效**。"
            fi
            echo
            echo "本页底部 **Artifacts** → 下载 \`wordsprint-staging-v${{ steps.meta.outputs.ver }}-${{ steps.meta.outputs.bid }}-r${{ github.run_number }}${{ steps.meta.outputs.sbs }}\`"
            echo "（是个 zip，解压得到 \`${{ steps.meta.outputs.apk }}\`）→ 覆盖安装（同分支），同签名、进度不丢。"
            echo
            echo "**没有**打 tag、**没有**发 Release：手机不会收到 stable OTA。"
            echo
            echo "App 内（设置页脚）应显示：\`v${{ steps.meta.outputs.ver }} · ${{ steps.meta.outputs.bid }}\` 开头的构建标识 —— 装错包一眼能看出来。"
          } >> "$GITHUB_STEP_SUMMARY"

      # 助手侧/无日志权限的人读不到 Actions 日志下载链接，所以把日志全文塞进一个自建 check-run，
      # 用 API 就能看：gh api /repos/<repo>/commits/<sha>/check-runs → ci-diagnostics 的 output.summary
      - name: 诊断写回 check-run（成功失败都写）
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
        run: |
          { echo "===== scripts/run_tests.sh ====="; cat /tmp/t.log 2>/dev/null || echo "(无)";
            echo; echo "===== build.sh ====="; cat /tmp/b.log 2>/dev/null || echo "(无)"; } > /tmp/diag.log
          tail -c 24000 /tmp/diag.log | iconv -f utf-8 -t utf-8 -c > /tmp/diag.trim || cp /tmp/diag.log /tmp/diag.trim
          SUMMARY=$(cat /tmp/diag.trim)
          gh api --method POST "/repos/${{ github.repository }}/check-runs" \
            -f name=ci-diagnostics -f head_sha="${{ github.sha }}" \
            -f status=completed -f conclusion="$STATUS" \
            -f "output[title]=staging 构建日志（$STATUS）" \
            -f "output[summary]=$SUMMARY" \
            -f "external_id=${{ github.run_id }}-diag" > /dev/null
          echo "诊断已写入 check-run ci-diagnostics（$(wc -l < /tmp/diag.log) 行）"

      - name: Upload artifact（不是 Release）
        uses: actions/upload-artifact@v4
        with:
          name: wordsprint-staging-v${{ steps.meta.outputs.ver }}-${{ steps.meta.outputs.bid }}-r${{ github.run_number }}${{ steps.meta.outputs.sbs }}
          path: ${{ steps.meta.outputs.apk }}
          retention-days: 14
          if-no-files-found: error

  # 只串行化对同一条 ci Release 的写操作，Android 构建本身仍可在多分支并行。
  # 删除分支事件由 sync_ci.yml 走同一个锁：不会在清理后被尚未结束的旧构建重新写回。
  publish:
    needs: build
    if: github.event.inputs.side_by_side != 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: ci-release-aggregation
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wordsprint-staging-v${{ needs.build.outputs.ver }}-${{ needs.build.outputs.bid }}-r${{ github.run_number }}${{ needs.build.outputs.sbs }}
          path: .
      - name: Publish ci 通道（预发布 Release 资产 + 现存分支版本索引）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_BRANCH: ${{ github.ref_name }}
        run: |
          bash scripts/publish_ci.sh "CI staging v${{ needs.build.outputs.ver }}（code ${{ needs.build.outputs.vc }}）"
          {
            echo
            echo "### 手机装机（App 内更新，不用手填地址）"
            echo
            echo "设置 → 关于与更新 → 更新源 →「分支」→ 选 \`${{ needs.build.outputs.bid }}\` → 检查 → 立即更新（同签名，覆盖安装不丢进度）"
            echo
            echo "坑位直链：\`https://github.com/${{ github.repository }}/releases/download/ci/update-${{ needs.build.outputs.bid }}.json\`"
            echo
            echo "> 根资产（update.json / wordsprint.apk）= 最近一次构建，仅供旧版直链兼容。各分支版本索引见 [Release ci](https://github.com/${{ github.repository }}/releases/tag/ci)。"
          } >> "$GITHUB_STEP_SUMMARY"

  # 手动修复旧聚合数据；旧 main 工作流尚无 sync_only input 时可传已有的 label=ci-sync-only。
  sync_only:
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.sync_only == 'true' || github.event.inputs.label == 'ci-sync-only')
    runs-on: ubuntu-latest
    concurrency:
      group: ci-release-aggregation
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: 同步 ci 现存分支（无需构建）
        env: { GH_TOKEN: "${{ github.token }}" }
        run: python3 scripts/ci_sync.py

# 战绩页（share/index.html）不走 Actions 发布，而是用 Pages 的「Deploy from a branch」：
# 仓库 Settings → Pages → Source = Deploy from a branch → main → /(root)（2026-09-22 从 dev 切到 main）。
# 真身永远在源码分支的 share/index.html；页面「各分支版本」一栏由 JS 直读 GitHub API。
